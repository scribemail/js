# Approve dependency build scripts (pnpm >= 10.26; this is what `pnpm approve-builds` writes).
# esbuild compiles a native platform binary in its postinstall, so it must be allowed to build.
allowBuilds:
  esbuild: true

# Security fixes Dependabot cannot make itself (security_update_not_possible): the parent pins the
# vulnerable version. Drop an entry once the parent requires the fixed one.
overrides:
  source-map-js: ^1.2.2
